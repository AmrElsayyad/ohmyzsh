name: sync-upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: git remote add upstream https://github.com/ohmyzsh/ohmyzsh.git

      - name: Fetch upstream and origin
        run: |
          git fetch upstream master
          git fetch origin master sayyad

      - name: Check if sync needed
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/master)
          MASTER=$(git rev-parse origin/master)
          SAYYAD=$(git rev-list --count upstream/master..origin/sayyad)
          if [ "$MASTER" = "$UPSTREAM" ] && [ "$SAYYAD" = "0" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Nothing to sync"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Fast-forward master
        if: steps.check.outputs.skip != 'true'
        run: git push --force-with-lease origin upstream/master:refs/heads/master

      - name: Rebase sayyad
        if: steps.check.outputs.skip != 'true'
        run: |
          git checkout -b sayyad origin/sayyad
          git rebase upstream/master || { echo "::error::Rebase conflicts"; git rebase --abort; exit 1; }
          git push --force-with-lease origin HEAD:refs/heads/sayyad

      - name: Cherry-pick workflow onto master (survival)
        if: steps.check.outputs.skip != 'true'
        run: |
          WF_SHA=$(git log --format=%H -1 -- .github/workflows/sync-upstream.yml origin/master || true)
          if [ -n "$WF_SHA" ]; then
            git checkout master
            git cherry-pick "$WF_SHA" 2>/dev/null || { git cherry-pick --abort; echo "::warning::cherry-pick failed, workflow may disappear"; }
            git push --force-with-lease origin HEAD:refs/heads/master
          fi